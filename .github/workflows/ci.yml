name: E2E

# The suite drives a third-party website, so it runs on demand instead of on every push.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scenario 1 headless
        run: pytest -m "e2e and scenario1" --headless --always-screenshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/
